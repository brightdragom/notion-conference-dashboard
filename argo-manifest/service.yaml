apiVersion: v1
kind: Service
metadata:
  name: conference-dashboard-service
  namespace: conference-dashboard
spec:
  selector:
    app: conference-dashboard
  type: NodePort
  ports:
    - protocol: TCP
      port: 80            # 내부 서비스 포트
      targetPort: 80
      nodePort: 30400     # 외부에서 접근할 포트 (30000–32767 사이에서 지정)

---
apiVersion: v1
kind: Service
metadata:
  name: notion-dashboard-backend-service
  namespace: conference-dashboard
spec:
  selector:
    app: notion-dashboard-backend
  type: NodePort
  ports:
    - protocol: TCP
      port: 5000
      nodePort: 30401
      targetPort: 5000
